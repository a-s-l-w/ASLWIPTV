name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installa Gradle 8.13 sul runner: il progetto non include il wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Give the APK its product name
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/ASLW IPTV-0.4.2-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASLW-IPTV-0.4.2-debug-apk
          path: app/build/outputs/apk/debug/ASLW IPTV-0.4.2-debug.apk
          if-no-files-found: error


